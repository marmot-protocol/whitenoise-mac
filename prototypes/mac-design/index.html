<!doctype html>
<html lang="en" data-scheme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>White Noise for Mac · Design preview</title>
<style>
/* ------------------------------------------------------------------
   Tokens. Appearance changes colours only; metrics are shared.
------------------------------------------------------------------- */
:root{
  --font:-apple-system,BlinkMacSystemFont,system-ui,"SF Pro Text","SF Pro","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.25,.8,.25,1);
  --t-fast:110ms; --t-med:200ms;
  --sb-w:280px; --insp-w:280px; --tb-h:52px;
  --ctl-h:24px; --ctl-h-sm:20px;
  --glass-filter:blur(14px) saturate(1.7);
}
:root,:root[data-scheme="light"]{
  color-scheme:light;
  --desk:#cfd0d4; --review:#f5f5f7; --review-sep:rgba(0,0,0,.1);
  --label:rgba(0,0,0,.85); --label2:rgba(0,0,0,.54); --label3:rgba(0,0,0,.3); --label4:rgba(0,0,0,.16);
  --sep:rgba(0,0,0,.085); --sep2:rgba(0,0,0,.15); --pane-sep:rgba(0,0,0,.09);
  /* Chrome-only material approximations (toolbar item groups, sidebar, menus). Never used on content. */
  --glass:rgba(255,255,255,.66);
  --glass-edge:inset 0 .5px 0 rgba(255,255,255,.95),inset 0 0 0 .5px rgba(255,255,255,.45),0 0 0 .5px rgba(0,0,0,.075),0 1px 2px rgba(0,0,0,.05),0 3px 12px rgba(0,0,0,.06);
  --side-glass:rgba(240,240,243,.84);
  --side-ring:inset 0 0 0 .5px rgba(0,0,0,.075),inset 0 1px 0 rgba(255,255,255,.75);
  --content-edge:rgba(255,255,255,.86); --inspector-edge:rgba(245,245,247,.86); --detail-edge:rgba(245,245,247,.86);
  --scrim:rgba(0,0,0,.2); --sheet-bg:#f6f6f8;
  --content:#fff; --sidebar:#ececee; --toolbar:#fbfbfc; --inspector:#f5f5f7; --detail:#f5f5f7;
  --group:#fff; --group-border:rgba(0,0,0,.075);
  --fill:rgba(0,0,0,.05); --fill2:rgba(0,0,0,.085); --hover:rgba(0,0,0,.055); --press:rgba(0,0,0,.1);
  --search:rgba(0,0,0,.062);
  --bubble-in:#ededf0; --bubble-in-fg:rgba(0,0,0,.86); --bubble-in-2:rgba(0,0,0,.52); --bubble-in-q:rgba(0,0,0,.055); --bubble-in-bar:rgba(0,0,0,.3);
  --bubble-out:#1d1d1f; --bubble-out-fg:#fff; --bubble-out-2:rgba(255,255,255,.62); --bubble-out-q:rgba(255,255,255,.12); --bubble-out-bar:rgba(255,255,255,.5);
  --primary:#1d1d1f; --on-primary:#fff;
  --control:#fff; --control-shadow:0 0 0 .5px rgba(0,0,0,.18),0 .5px 1.5px rgba(0,0,0,.12); --control-press:#ececef;
  --field:#fff; --field-border:rgba(0,0,0,.17); --cb-border:rgba(0,0,0,.3);
  --seg-track:rgba(0,0,0,.065); --seg-on:#fff; --seg-on-shadow:0 0 0 .5px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.12);
  --sel:#0b63d6; --sel-fg:#fff; --sel-2:rgba(255,255,255,.78); --sel-inactive:rgba(0,0,0,.085);
  --focus:rgba(11,99,214,.42); --red:#de3329;
  --find:rgba(255,212,0,.42); --find-cur:#ffd60a; --find-fg:#1d1d1f;
  --menu:rgba(247,247,249,.8); --menu-shadow:0 12px 34px rgba(0,0,0,.17),0 0 0 .5px rgba(0,0,0,.13),inset 0 .5px 0 rgba(255,255,255,.8);
  --win-shadow:0 0 0 .5px rgba(0,0,0,.22),0 26px 70px -10px rgba(0,0,0,.34),0 8px 24px rgba(0,0,0,.1);
  --win-highlight:transparent;
  --sheet-shadow:0 0 0 .5px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06),0 14px 40px rgba(0,0,0,.2);
  --spec-shadow:0 0 0 .5px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.06);
  --av0:#e3e3e7; --av0f:#3a3a3d; --av1:#d4d4d9; --av1f:#2f2f32; --av2:#c6c6cb; --av2f:#28282b; --av3:#ebebee; --av3f:#46464a; --av4:#b9b9be; --av4f:#202022;
  --doc-fill:#fff; --doc-line:rgba(0,0,0,.22); --doc-text:rgba(0,0,0,.58);
}
:root[data-scheme="dark"]{
  color-scheme:dark;
  --desk:#121214; --review:#1c1c1e; --review-sep:rgba(255,255,255,.08);
  --label:rgba(255,255,255,.88); --label2:rgba(255,255,255,.56); --label3:rgba(255,255,255,.3); --label4:rgba(255,255,255,.16);
  --sep:rgba(255,255,255,.085); --sep2:rgba(255,255,255,.15); --pane-sep:rgba(0,0,0,.55);
  --glass:rgba(64,64,68,.5);
  --glass-edge:inset 0 .5px 0 rgba(255,255,255,.17),inset 0 0 0 .5px rgba(255,255,255,.07),0 0 0 .5px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.28);
  --side-glass:rgba(44,44,48,.84);
  --side-ring:inset 0 0 0 .5px rgba(255,255,255,.085),inset 0 1px 0 rgba(255,255,255,.06);
  --content-edge:rgba(30,30,32,.86); --inspector-edge:rgba(35,35,37,.86); --detail-edge:rgba(31,31,33,.86);
  --scrim:rgba(0,0,0,.38); --sheet-bg:#29292c;
  --content:#1e1e20; --sidebar:#2a2a2d; --toolbar:#262628; --inspector:#232325; --detail:#1f1f21;
  --group:#2a2a2d; --group-border:rgba(255,255,255,.06);
  --fill:rgba(255,255,255,.07); --fill2:rgba(255,255,255,.11); --hover:rgba(255,255,255,.07); --press:rgba(255,255,255,.12);
  --search:rgba(255,255,255,.08);
  --bubble-in:#313134; --bubble-in-fg:rgba(255,255,255,.9); --bubble-in-2:rgba(255,255,255,.55); --bubble-in-q:rgba(255,255,255,.07); --bubble-in-bar:rgba(255,255,255,.35);
  --bubble-out:#ececef; --bubble-out-fg:#1d1d1f; --bubble-out-2:rgba(0,0,0,.55); --bubble-out-q:rgba(0,0,0,.07); --bubble-out-bar:rgba(0,0,0,.35);
  --primary:#f2f2f4; --on-primary:#1d1d1f;
  --control:#3d3d40; --control-shadow:0 0 0 .5px rgba(0,0,0,.5),inset 0 .5px 0 rgba(255,255,255,.09); --control-press:#4a4a4d;
  --field:rgba(255,255,255,.055); --field-border:rgba(255,255,255,.16); --cb-border:rgba(255,255,255,.28);
  --seg-track:rgba(255,255,255,.08); --seg-on:#5b5b5f; --seg-on-shadow:0 0 0 .5px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
  --sel:#0a59c7; --sel-inactive:rgba(255,255,255,.1);
  --focus:rgba(60,140,255,.5); --red:#ff6259;
  --find:rgba(255,214,10,.4); --find-cur:#ffd60a; --find-fg:#1d1d1f;
  --menu:rgba(42,42,46,.8); --menu-shadow:0 12px 34px rgba(0,0,0,.5),0 0 0 .5px rgba(0,0,0,.7),inset 0 0 0 .5px rgba(255,255,255,.1);
  --win-shadow:0 0 0 .5px rgba(0,0,0,.9),0 26px 70px -10px rgba(0,0,0,.7),0 8px 24px rgba(0,0,0,.35);
  --win-highlight:rgba(255,255,255,.13);
  --sheet-shadow:0 0 0 .5px rgba(0,0,0,.75),inset 0 0 0 .5px rgba(255,255,255,.1),0 16px 44px rgba(0,0,0,.5);
  --spec-shadow:0 0 0 .5px rgba(0,0,0,.8),inset 0 0 0 .5px rgba(255,255,255,.07);
  --av0:#4a4a4e; --av0f:#efeff1; --av1:#3c3c40; --av1f:#e6e6e9; --av2:#57575c; --av2f:#f4f4f6; --av3:#333336; --av3f:#d9d9dd; --av4:#626267; --av4f:#fafafa;
  --doc-fill:#3a3a3d; --doc-line:rgba(255,255,255,.2); --doc-text:rgba(255,255,255,.7);
}

/* ------------------------------------------------------------------ base */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:13px/1.38 var(--font);color:var(--label);background:var(--desk);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;letter-spacing:-.003em}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:default;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
:focus{outline:none}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round;display:block}
.i.inl{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:3px}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:0}
.spacer{flex:1}

/* ------------------------------------------------------------------ review bar (outside the app) */
.review{flex:none;min-height:48px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:8px 16px;
  background:var(--review);border-bottom:.5px solid var(--review-sep);position:relative;z-index:5}
.rv-left{display:flex;align-items:baseline;gap:10px;min-width:0;white-space:nowrap}
.rv-title{font-weight:600}
.rv-note{color:var(--label2);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.rv-right{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.rv-label{color:var(--label2);font-size:12px}
.rv-size{color:var(--label3);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:74px;margin-right:6px}
.rv-views button{padding:0 9px}
.rv-views .k{color:var(--label3);font-variant-numeric:tabular-nums;margin-right:5px}
@media (max-width:1320px){.rv-note{display:none}}

/* ------------------------------------------------------------------ stage */
.stage{flex:1;min-height:0;display:flex;overflow:auto;padding:28px}
.scene{margin:auto;display:flex;min-width:0}

/* ------------------------------------------------------------------ shared controls (current macOS control shapes) */
.seg{display:inline-flex;padding:2px;background:var(--seg-track);border-radius:12px;position:relative}
.seg button{position:relative;border:0;background:transparent;height:20px;padding:0 10px;border-radius:10px;font-size:12px;
  color:var(--label);white-space:nowrap;transition:background var(--t-fast) var(--ease)}
.seg button.on{background:var(--seg-on);box-shadow:var(--seg-on-shadow);font-weight:500}
.seg button:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.seg button:disabled{opacity:.4}
.seg.full{display:flex}.seg.full button{flex:1;padding:0 6px}

.btn{height:var(--ctl-h);padding:0 12px;border:0;border-radius:calc(var(--ctl-h) / 2);background:var(--control);box-shadow:var(--control-shadow);
  font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;color:var(--label)}
.btn:active:not(:disabled):not(.static){background:var(--control-press)}
.btn .i{width:14px;height:14px}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 .5px 1px rgba(0,0,0,.15)}
.btn.primary:active:not(:disabled){filter:brightness(.86)}
:root[data-scheme="dark"] .btn.primary:active:not(:disabled){filter:brightness(.9)}
.btn.danger{color:var(--red)}
.btn.small{height:var(--ctl-h-sm);font-size:12px;padding:0 9px;border-radius:calc(var(--ctl-h-sm) / 2);gap:4px}
.btn.small .i{width:13px;height:13px}
.btn:disabled{opacity:.42}
.btn:focus-visible,.popup:focus-visible{box-shadow:var(--control-shadow),0 0 0 3px var(--focus)}
.btn.primary:focus-visible{box-shadow:0 0 0 3px var(--focus)}

.tb-btn{width:30px;height:28px;border:0;background:transparent;border-radius:7px;color:var(--label2);display:grid;place-items:center;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.tb-btn .i{width:17px;height:17px}
.tb-btn:hover:not(.static){background:var(--hover);color:var(--label)}
.tb-btn:active:not(.static){background:var(--press)}
.tb-btn.on{background:var(--fill2);color:var(--label)}
.tb-btn.sm{width:22px;height:20px;border-radius:6px}.tb-btn.sm .i{width:14px;height:14px}
.tb-btn:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.static{cursor:default}

/* Toolbar item group: one capsule per related group. The material is drawn on the group only, never per glyph. */
.tb-group{display:flex;align-items:center;height:32px;padding:0 2px;border-radius:16px;background:var(--glass);box-shadow:var(--glass-edge);
  -webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter);flex:none}
.tb-group .tb-btn{width:34px;height:28px;border-radius:14px;color:var(--label)}
.tb-group .tb-btn .i{width:17px;height:17px}

.popup{height:var(--ctl-h);border:0;border-radius:calc(var(--ctl-h) / 2);background:var(--control);box-shadow:var(--control-shadow);padding:0 6px 0 11px;
  display:inline-flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;line-height:1;min-width:132px;color:var(--label);white-space:nowrap}
.popup .i{width:12px;height:12px;color:var(--label2);stroke-width:1.7}
.popup.small{height:var(--ctl-h-sm);font-size:12px;min-width:0;border-radius:calc(var(--ctl-h-sm) / 2);padding:0 5px 0 9px;gap:6px}
.popup:disabled{opacity:.42}

.search-field{display:flex;align-items:center;gap:5px;height:28px;padding:0 6px 0 9px;border-radius:14px;background:var(--search);
  color:var(--label2);transition:box-shadow var(--t-fast) var(--ease)}
.search-field .i{width:14px;height:14px}
.search-field input{flex:1;min-width:0;border:0;background:transparent;height:100%;padding:0;color:var(--label);font-size:13px}
.search-field input::placeholder{color:var(--label3)}
.search-field input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search-field:focus-within{box-shadow:0 0 0 3px var(--focus)}
.search-field.small{height:24px;border-radius:12px}
.search-field.small input{font-size:12px}
.sf-clear{border:0;background:transparent;padding:0;color:var(--label3);display:grid;place-items:center;width:18px;height:18px}
.sf-clear .i{width:14px;height:14px}
.sf-clear:hover{color:var(--label2)}

.tf{height:var(--ctl-h);width:100%;border:0;border-radius:7px;padding:0 8px;background:var(--field);
  box-shadow:inset 0 0 0 .5px var(--field-border),0 .5px 0 rgba(0,0,0,.04);font-size:13px;color:var(--label)}
.tf.ta{height:auto;min-height:60px;padding:4px 8px;resize:none;line-height:18px;display:block}
.tf:focus{box-shadow:inset 0 0 0 .5px var(--sel),0 0 0 3px var(--focus)}
.tf.invalid{box-shadow:inset 0 0 0 1px var(--red)}
.tf.invalid:focus{box-shadow:inset 0 0 0 1px var(--red),0 0 0 3px var(--focus)}
.tf::placeholder{color:var(--label3)}

.cb-box{width:14px;height:14px;border-radius:4px;background:var(--control);box-shadow:inset 0 0 0 .5px var(--cb-border),0 .5px 1px rgba(0,0,0,.08);
  display:grid;place-items:center;color:transparent;flex:none}
.cb-box .i{width:11px;height:11px;stroke-width:2.3}
input.cb-in{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
input.cb-in:checked+.cb-box{background:var(--primary);box-shadow:none;color:var(--on-primary)}
input.cb-in:focus-visible+.cb-box{box-shadow:inset 0 0 0 .5px var(--cb-border),0 0 0 3px var(--focus)}
input.cb-in:checked:focus-visible+.cb-box{box-shadow:0 0 0 3px var(--focus)}
input.cb-in:disabled+.cb-box{opacity:.45}

.ctl-group{display:inline-flex;border-radius:calc(var(--ctl-h) / 2);background:var(--control);box-shadow:var(--control-shadow);overflow:hidden}
.ctl-group button{border:0;background:transparent;height:var(--ctl-h);width:30px;display:grid;place-items:center;color:var(--label)}
.ctl-group button+button{box-shadow:inset .5px 0 0 var(--sep2)}
.ctl-group button:active:not(:disabled){background:var(--control-press)}
.ctl-group button:disabled{color:var(--label3)}
.ctl-group .i{width:14px;height:14px}
.ctl-group.wide button{width:36px}
.ctl-group button:first-child{padding-left:2px}.ctl-group button:last-child{padding-right:2px}

/* ------------------------------------------------------------------ avatars */
.av{--s:32px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;
  font-size:calc(var(--s) * .38);font-weight:600;letter-spacing:.01em;line-height:1}
.av.t0{background:var(--av0);color:var(--av0f)}.av.t1{background:var(--av1);color:var(--av1f)}.av.t2{background:var(--av2);color:var(--av2f)}
.av.t3{background:var(--av3);color:var(--av3f)}.av.t4{background:var(--av4);color:var(--av4f)}

/* ------------------------------------------------------------------ windows */
.window{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--win-shadow);background:var(--content);display:flex;isolation:isolate;flex:none}
.window::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 .5px var(--win-highlight);pointer-events:none;z-index:40}
.lights{position:absolute;left:20px;top:20px;display:flex;gap:8px;z-index:30;pointer-events:none}
.lights i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.16)}
.lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

/* Floating sidebar panel: chrome material, inset from the window edge, no drop shadow on content. */
.glass-panel{background:linear-gradient(to bottom,rgba(255,255,255,.07),rgba(255,255,255,0) 140px),var(--side-glass);border-radius:14px;box-shadow:var(--side-ring);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6)}

/* Thin, draggable split dividers (hit area wider than the drawn line). */
.split-div{flex:none;width:0;position:relative;z-index:7;outline:none}
.split-div::before{content:"";position:absolute;top:0;bottom:0;left:-4px;width:8px;cursor:col-resize}
.split-div:focus-visible::after{content:"";position:absolute;top:8px;bottom:8px;left:-1px;width:2px;border-radius:1px;background:var(--focus)}
.resizing,.resizing *{cursor:col-resize!important;-webkit-user-select:none!important;user-select:none!important}
.resizing .sidebar,.resizing .inspector,.resizing .toolbar{transition:none!important}

/* Per-pane scroll edge: content scrolls beneath the transparent toolbar and softens under it. */
.scroll-edge{position:absolute;left:0;right:0;top:0;height:calc(var(--tb-h) + 14px);z-index:4;pointer-events:none;
  background:linear-gradient(to bottom,var(--edge-c) calc(100% - 14px),transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 14px),transparent)}

/* ------------------------------------------------------------------ main window */
.main-window{width:1080px;height:700px;max-width:100%}
.sb-toggle{position:absolute;left:78px;top:10px;z-index:30;padding:2px;border-radius:16px}
.sb-collapsed .sb-toggle{background:var(--glass);box-shadow:var(--glass-edge);-webkit-backdrop-filter:var(--glass-filter);backdrop-filter:var(--glass-filter)}
.sb-collapsed .sb-toggle .tb-btn{width:34px;border-radius:14px;color:var(--label)}
.sidebar{width:var(--sb-w);flex:none;overflow:hidden;transition:width var(--t-med) var(--ease)}
.sb-collapsed .sidebar{width:0}
.sb-inner{width:calc(var(--sb-w) - 8px);height:calc(100% - 16px);margin:8px 0 8px 8px;display:flex;flex-direction:column;overflow:hidden}
.sb-titlebar{height:36px;flex:none;display:flex;align-items:center;justify-content:flex-end;padding:0 6px}
.ident-btn{display:flex;align-items:center;gap:8px;margin:0 10px 8px;height:30px;padding:0 8px 0 6px;border:0;border-radius:7px;background:transparent;text-align:left}
.ident-btn:hover{background:var(--hover)}
.ident-btn[aria-expanded="true"]{background:var(--press)}
.ident-btn .ident-name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ident-btn .i{width:12px;height:12px;color:var(--label2);stroke-width:1.7}
.ident-btn:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.sb-search{margin:0 10px 8px}
.sb-list{flex:1;overflow-y:auto;padding:2px 0 12px;border-top:.5px solid transparent;transition:border-color var(--t-fast) linear}
.sb-list.scrolled{border-top-color:var(--sep2)}

.chat-row{display:grid;grid-template-columns:40px 1fr;column-gap:10px;width:calc(100% - 20px);margin:0 10px;padding:8px 9px 9px 8px;
  border:0;border-radius:8px;background:transparent;text-align:left;align-items:start}
.chat-row+.chat-row{margin-top:1px}
.chat-row:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
.cr-main{display:block;min-width:0}
.cr-top{display:flex;align-items:baseline;gap:5px}
.cr-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cr-muted{width:12px;height:12px;color:var(--label3);align-self:center}
.cr-time{margin-left:auto;padding-left:6px;font-size:11.5px;color:var(--label2);white-space:nowrap;font-variant-numeric:tabular-nums}
.cr-bottom{display:flex;align-items:flex-start;gap:8px;margin-top:1px}
.cr-prev{flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--label2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cr-prev .i.inl{width:11px;height:11px;vertical-align:-1px}
.cr-prev .draft{color:var(--label);font-weight:500}
.cr-prev .failed{color:var(--red)}
.cr-prev .invite{color:var(--label);font-weight:500}
.badge{flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:var(--on-primary);
  font-size:11px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums;margin-top:-1px}
.chat-row.unread .cr-prev{color:var(--label)}
.chat-row.is-sel,.res-row.is-sel{background:var(--sel);color:var(--sel-fg)}
.chat-row.is-sel .cr-time,.chat-row.is-sel .cr-prev,.chat-row.is-sel .cr-muted,.chat-row.is-sel .cr-prev .draft,.chat-row.is-sel .cr-prev .failed,
.res-row.is-sel .res-time,.res-row.is-sel .res-snip{color:var(--sel-2)}
.chat-row.is-sel .av{box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.chat-row.inactive-sel{background:var(--sel-inactive)}

.sb-sec{display:flex;justify-content:space-between;align-items:baseline;padding:10px 20px 4px;font-size:11px;font-weight:600;color:var(--label2)}
.sb-sec .n{font-weight:500;color:var(--label3);font-variant-numeric:tabular-nums}
.res-row{display:grid;grid-template-columns:28px 1fr;column-gap:9px;width:calc(100% - 20px);margin:0 10px;padding:7px 9px 8px 8px;border:0;border-radius:8px;background:transparent;text-align:left;align-items:start}
.res-row+.res-row{margin-top:1px}
.res-main{display:block;min-width:0}
.res-top{display:flex;align-items:baseline;gap:6px}
.res-name{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-time{margin-left:auto;font-size:11px;color:var(--label2);white-space:nowrap}
.res-snip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;line-height:16px;color:var(--label2);margin-top:1px}
.res-snip mark{background:none;color:var(--label);font-weight:600}
.res-row.is-sel .res-snip mark{color:#fff}
.sb-empty{padding:40px 24px;text-align:center;color:var(--label2)}
.sb-empty b{display:block;color:var(--label);font-size:13px;margin-bottom:2px}

.detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--content);position:relative}
/* Transparent toolbar over the panes; only its item groups carry material. */
.toolbar{position:absolute;left:0;right:0;top:0;height:var(--tb-h);z-index:6;display:flex;align-items:center;gap:12px;padding:0 10px 0 20px;
  pointer-events:none;transition:padding var(--t-med) var(--ease)}
.sb-collapsed .toolbar{padding-left:130px}
.tb-title{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.insp-open .tb-title{max-width:calc(100% - var(--insp-w) - 2px)} /* title stays over the conversation column */
.tb-name{font-weight:600;font-size:13px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11px;line-height:14px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;align-items:center;gap:10px;flex:none;pointer-events:auto}
.detail-body{flex:1;min-height:0;display:flex}
.conv{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;--edge-c:var(--content-edge);container-type:inline-size}
.conv.find-open .scroll-edge{height:calc(var(--tb-h) + 38px + 14px)}

.findbar{position:absolute;left:0;right:0;top:var(--tb-h);z-index:5;height:38px;display:flex;align-items:center;gap:10px;padding:0 12px 0 16px}
.findbar .search-field{flex:0 1 250px;min-width:120px;height:24px;border-radius:12px;background:var(--field);box-shadow:inset 0 0 0 .5px var(--field-border)}
.findbar .search-field:focus-within{box-shadow:inset 0 0 0 .5px var(--sel),0 0 0 3px var(--focus)}
.fb-count{font-size:12px;color:var(--label2);min-width:56px;font-variant-numeric:tabular-nums;white-space:nowrap}

.transcript{flex:1;min-height:0;overflow-y:auto;overflow-anchor:none;padding:calc(var(--tb-h) + 8px) 28px 10px} /* script owns anchoring */
.conv.find-open .transcript{padding-top:calc(var(--tb-h) + 38px + 8px)}
@container (max-width:520px){
  .conv .transcript{padding-left:16px;padding-right:16px}
  .conv .run-stack{max-width:86%}
  .conv .composer{padding-left:10px;padding-right:10px}
  .conv .fb-count{min-width:0}
}
.tr-inner{max-width:880px;margin:0 auto;display:flex;flex-direction:column}
.tr-day{align-self:center;margin:18px 0 6px;font-size:11px;font-weight:600;color:var(--label2)}
.tr-day:first-child{margin-top:4px}
.tr-sys{align-self:center;margin:12px 0 4px;font-size:11.5px;color:var(--label2);display:flex;align-items:center;gap:4px;text-align:center}
.tr-sys .i{width:12px;height:12px}
.run{display:flex;gap:8px;margin-top:14px}
.run.out{justify-content:flex-end}
.run-av{padding-top:20px;flex:none}
.run-stack{display:flex;flex-direction:column;align-items:flex-start;gap:2px;max-width:min(72%,520px);min-width:0}
.run.out .run-stack{align-items:flex-end}
.run.in:not(.has-av) .run-stack{margin-left:0}
.run-head{display:flex;align-items:baseline;gap:7px;padding:0 4px 2px;font-size:11.5px;line-height:16px}
.run-sender{font-weight:600;color:var(--label2)}
.run-time,.run-meta{color:var(--label3);font-variant-numeric:tabular-nums}
.run-meta{font-size:11px;padding:3px 4px 0;display:flex;align-items:center;gap:3px;color:var(--label2)}
.run-meta .i{width:11px;height:11px;stroke-width:1.8}
.run-meta .failed{color:var(--red);display:inline-flex;align-items:center;gap:3px}

.bubble{--r:17px;--j:5px;position:relative;max-width:100%;border-radius:var(--r);padding:7px 12px 8px;line-height:18px;
  background:var(--bubble-in);color:var(--bubble-in-fg);overflow-wrap:anywhere;-webkit-user-select:text;user-select:text;cursor:auto}
.run.in .bubble.first{border-bottom-left-radius:var(--j)}
.run.in .bubble.mid{border-top-left-radius:var(--j);border-bottom-left-radius:var(--j)}
.run.in .bubble.last{border-top-left-radius:var(--j)}
.run.out .bubble{background:var(--bubble-out);color:var(--bubble-out-fg)}
.run.out .bubble.first{border-bottom-right-radius:var(--j)}
.run.out .bubble.mid{border-top-right-radius:var(--j);border-bottom-right-radius:var(--j)}
.run.out .bubble.last{border-top-right-radius:var(--j)}
.bubble.ctx-target{box-shadow:0 0 0 2px var(--sel)}
.bubble.failed{opacity:.72}
.quote{display:flex;flex-direction:column;margin:1px -4px 6px;padding:4px 8px 5px 9px;border-radius:9px;background:var(--bubble-in-q);
  box-shadow:inset 2px 0 0 var(--bubble-in-bar);font-size:12px;line-height:16px;min-width:0}
.run.out .quote{background:var(--bubble-out-q);box-shadow:inset 2px 0 0 var(--bubble-out-bar)}
.q-name{font-weight:600}
.q-text{color:var(--bubble-in-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run.out .q-text{color:var(--bubble-out-2)}
.bubble.media{padding:0;overflow:hidden;width:min(320px,100%)}
.b-img svg{display:block;width:100%;height:auto}
.bubble.media .b-text{padding:7px 12px 8px}
.bubble.file{padding:8px 14px 8px 8px}
.file-card{display:flex;align-items:center;gap:10px;min-width:min(230px,100%)}
.file-ico svg{display:block;width:30px;height:38px}
.file-ico .pg{fill:var(--doc-fill);stroke:var(--doc-line)}
.file-ico .fold{fill:none;stroke:var(--doc-line)}
.file-ico text{fill:var(--doc-text);font:700 7px var(--font);letter-spacing:.02em}
.file-main{display:flex;flex-direction:column;min-width:0}
.file-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:11.5px;color:var(--bubble-in-2)}
mark.hit{background:var(--find);color:inherit;border-radius:3px;padding:0 1px;margin:0 -1px}
mark.hit.current{background:var(--find-cur);color:var(--find-fg);box-shadow:0 0 0 1.5px var(--find-cur),0 1px 3px rgba(0,0,0,.3)}
.reacts{display:flex;gap:4px;margin:2px 2px 4px}
.react{height:22px;padding:0 7px 0 6px;border-radius:11px;border:0;background:var(--content);box-shadow:inset 0 0 0 .5px var(--sep2);
  display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums}
.react span{font-weight:500}
.react:hover{background:var(--hover)}
.react.mine{background:var(--fill2);box-shadow:inset 0 0 0 1px var(--label3);color:var(--label)}
.react.mine span{font-weight:600}
.react:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.invite-note{align-self:center;margin-top:18px;max-width:380px;text-align:center;color:var(--label2);font-size:12px}

.composer{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px 16px 16px}
.c-btn{width:30px;height:32px;border:0;border-radius:7px;background:transparent;color:var(--label2);display:grid;place-items:center;flex:none}
.c-btn .i{width:18px;height:18px}
.c-field{flex:1;min-width:0;display:flex;align-items:flex-end;gap:4px;min-height:32px;padding:6px 6px 6px 13px;border-radius:16px;
  background:var(--content);box-shadow:inset 0 0 0 .5px var(--sep2),0 1px 2px rgba(0,0,0,.04);transition:box-shadow var(--t-fast) var(--ease)}
.c-field:focus-within{box-shadow:inset 0 0 0 1px var(--label3),0 1px 2px rgba(0,0,0,.04)}
.c-field textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;line-height:18px;height:20px;max-height:126px;padding:1px 0;font-size:13px}
.c-field textarea::placeholder{color:var(--label3)}
.c-field .c-btn{width:22px;height:20px}
.c-field .c-btn .i{width:17px;height:17px}
.c-send{width:30px;height:30px;margin-bottom:1px;border:0;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.c-send .i{width:16px;height:16px;stroke-width:2}
.c-send:disabled{background:var(--fill2);color:var(--label3)}
.c-send:focus-visible{box-shadow:0 0 0 3px var(--focus)}

/* inspector */
.inspector{width:0;flex:none;overflow:hidden;background:var(--inspector);transition:width var(--t-med) var(--ease);position:relative;--edge-c:var(--inspector-edge)}
.insp-open .inspector{width:var(--insp-w);box-shadow:inset 1px 0 0 var(--pane-sep)}
.insp-inner{width:var(--insp-w);height:100%;overflow-y:auto;padding:calc(var(--tb-h) + 10px) 16px 28px 17px}
.insp-id{display:flex;flex-direction:column;align-items:center;text-align:center}
.insp-name{margin-top:10px;font-size:15px;font-weight:600;line-height:20px}
.insp-desc{font-size:12px;color:var(--label);margin-top:2px}
.insp-meta{font-size:11.5px;color:var(--label2);margin-top:2px}
.insp-actions{display:flex;justify-content:center;gap:6px;margin:14px 0 20px}
.ins-sec{margin-top:18px}
.ins-sec:first-of-type{margin-top:0}
.ins-h{display:flex;align-items:center;justify-content:space-between;margin:0 2px 7px;font-size:12px;font-weight:600;min-height:20px}
.ins-h .n{color:var(--label2);font-weight:500;margin-left:4px}
.link-btn{border:0;background:transparent;padding:0;font-size:12px;color:var(--label2)}
.ins-terminal{margin-top:26px;padding-top:18px;border-top:.5px solid var(--sep2)}
.media-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.thumb{aspect-ratio:1;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 .5px var(--sep)}
.thumb svg{display:block;width:100%;height:100%}
.list-rows{margin-top:8px}
.lrow{display:flex;align-items:center;gap:9px;padding:6px 2px}
.lrow+.lrow{box-shadow:0 -.5px 0 var(--sep)}
.lrow .ico{width:28px;height:28px;border-radius:6px;background:var(--fill);display:grid;place-items:center;color:var(--label2);flex:none}
.lrow .ico .i{width:15px;height:15px}
.lrow .t{display:flex;flex-direction:column;min-width:0}
.lrow .t b{font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t span{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disclosure{display:flex;align-items:center;gap:4px;border:0;background:transparent;padding:2px 2px;font-size:12px;font-weight:600;margin-bottom:7px}
.disclosure .i{width:11px;height:11px;stroke-width:2;color:var(--label2);transition:transform var(--t-fast) var(--ease)}
.disclosure[aria-expanded="true"] .i{transform:rotate(90deg)}
.disclosure:focus-visible{box-shadow:0 0 0 3px var(--focus);border-radius:4px}
.members .fs-row{padding:5px 10px;min-height:34px;gap:9px;justify-content:flex-start}
.members .m-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;color:var(--label2);padding:1px 6px;border-radius:4px;box-shadow:inset 0 0 0 .5px var(--sep2);white-space:nowrap}
.row-btn{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;font-size:13px}
.row-btn.danger{color:var(--red)}
.row-btn:active:not(.static){background:var(--press)}

/* ------------------------------------------------------------------ grouped form */
.fs{margin-bottom:20px}
.fs-h{font-size:13px;font-weight:600;margin:0 2px 7px}
.fs-group{background:var(--group);border-radius:11px;box-shadow:0 0 0 .5px var(--group-border)}
.fs-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:38px;padding:8px 12px}
.fs-row+.fs-row::before{content:"";position:absolute;top:0;left:12px;right:12px;height:.5px;background:var(--sep)}
.fs-row .lbl{min-width:0}
.fs-row .sub{display:block;font-size:11.5px;color:var(--label2);margin-top:1px;line-height:15px}
.fs-row .val{color:var(--label2);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-row.dim>.lbl{opacity:.45}
.fs-row.nav{cursor:default}
.fs-row.nav .val{display:flex;align-items:center;gap:6px}
.fs-row.nav .i{width:11px;height:11px;stroke-width:2;color:var(--label3)}
.fs-row.btns{justify-content:flex-start;gap:8px}
.fs-footer{font-size:11.5px;line-height:15px;color:var(--label2);margin:6px 12px 0}
.fs.terminal{margin-top:30px}
/* Mac checkbox: box leads, title trails, description sits under the title on the same leading edge. */
.fs-row.check-row{justify-content:flex-start;align-items:flex-start;gap:7px;cursor:default}
.check-row .cb-box{margin-top:2px}
.check-row .lbl{flex:1}
.insp-inner .fs-row{min-height:32px;padding:6px 10px;font-size:12.5px}
.insp-inner .fs-row+.fs-row::before{left:10px;right:10px}
.insp-inner .fs-footer{margin:5px 10px 0;font-size:11px}

/* ------------------------------------------------------------------ menus */
.menu{position:fixed;z-index:1000;min-width:190px;padding:5px;border-radius:12px;background:var(--menu);box-shadow:var(--menu-shadow);
  -webkit-backdrop-filter:blur(30px) saturate(1.8);backdrop-filter:blur(30px) saturate(1.8);animation:menu-in var(--t-fast) var(--ease)}
.menu.inline{position:absolute;animation:none}
@keyframes menu-in{from{opacity:0}to{opacity:1}}
.menu-item{display:flex;align-items:center;width:100%;height:24px;padding:0 12px 0 4px;border:0;border-radius:6px;background:transparent;text-align:left;font-size:13px;color:var(--label)}
.menu-item .mi-check{width:20px;display:grid;place-items:center;flex:none}
.menu-item .mi-check .i{width:11px;height:11px;stroke-width:2.2}
.menu-item .mi-ico{width:16px;height:16px;margin-right:8px;display:grid;place-items:center;flex:none}
.menu-item .mi-ico .i{width:16px;height:16px;stroke-width:1.4}
.menu-item .mi-label{flex:1;white-space:nowrap}
.menu-item .mi-key{margin-left:24px;color:var(--label3);font-size:12.5px;letter-spacing:.04em}
.menu-item.danger{color:var(--red)}
.menu-item:hover:not(:disabled),.menu-item:focus-visible{background:var(--sel);color:#fff}
.menu-item:hover:not(:disabled) .mi-key,.menu-item:focus-visible .mi-key{color:rgba(255,255,255,.75)}
.menu-item:disabled{color:var(--label3)}
.menu.no-check .menu-item{padding-left:10px}
.menu.no-check .mi-check{display:none}
.menu-sep{height:1px;background:var(--sep);margin:5px 10px}
.menu-h{font-size:11px;font-weight:600;color:var(--label2);padding:4px 10px 2px 24px}
.menu.no-check .menu-h{padding-left:10px}

/* ------------------------------------------------------------------ settings window */
.set-window{width:860px;height:640px;max-width:100%;container:setwin / inline-size}
.set-split{display:flex;flex:1;min-width:0}
.set-sidebar{width:228px;flex:none;display:flex}
.set-panel{flex:1;min-width:0;margin:8px 0 8px 8px;display:flex;flex-direction:column;overflow:hidden}
.set-sb-top{height:36px;flex:none}
.set-ident{display:flex;align-items:center;gap:9px;margin:0 10px 10px;padding:6px 8px;border:0;border-radius:8px;background:transparent;text-align:left}
.set-ident:hover{background:var(--hover)}
.set-ident .t{display:flex;flex-direction:column;min-width:0}
.set-ident b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-ident span.mono{font-size:10.5px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-ident:focus-visible{box-shadow:0 0 0 3px var(--focus)}
.set-nav{flex:1;overflow-y:auto;padding:0 10px 14px}
.set-group+.set-group{margin-top:12px;padding-top:12px;box-shadow:inset 0 .5px 0 var(--sep)}
.set-item{display:flex;align-items:center;gap:8px;width:100%;height:28px;padding:0 8px;border:0;border-radius:6px;background:transparent;text-align:left}
.set-item .i{color:var(--label2);width:16px;height:16px}
.set-item:focus-visible{box-shadow:inset 0 0 0 2px var(--focus)}
.set-item.is-sel{background:var(--sel);color:#fff}
.set-item.is-sel .i{color:#fff}
.set-detail{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--detail);position:relative;--edge-c:var(--detail-edge)}
.set-toolbar{position:absolute;left:0;right:0;top:0;z-index:6;height:var(--tb-h);display:flex;align-items:center;padding:0 20px;gap:6px;pointer-events:none}
.set-title{display:flex;align-items:center;gap:10px;font-weight:600;font-size:13px;min-width:0;white-space:nowrap}
.set-title>*{pointer-events:auto}
.set-title .tb-group .tb-btn{width:32px}
.set-body{flex:1;overflow-y:auto}
.set-form{max-width:600px;margin:0 auto;padding:calc(var(--tb-h) + 6px) 28px 32px}
@container setwin (max-width:740px){
  .set-window .set-sidebar{width:200px}
  .set-window .set-form{padding-left:20px;padding-right:20px}
  .set-window .fs-row:not(.check-row){flex-wrap:wrap;row-gap:6px}
}
.prof-row{gap:14px;padding:14px 14px}
.prof-row .t{flex:1;min-width:0}
.prof-name{font-size:15px;font-weight:600;line-height:20px}
.prof-about{font-size:12px;color:var(--label2);margin-top:1px}
.notif-ex{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border-radius:11px;background:var(--fill)}
.notif-ex .app{width:28px;height:28px;border-radius:7px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.notif-ex .app .i{width:16px;height:16px}
.notif-ex .t{display:flex;flex-direction:column;min-width:0;font-size:12px;line-height:16px}
.notif-ex .t b{font-weight:600}
.notif-ex .t span{color:var(--label2)}
.notif-ex .when{margin-left:auto;align-self:flex-start;font-size:11px;color:var(--label3)}
.rx-row{display:flex;gap:6px}
.rx{width:30px;height:28px;border-radius:6px;background:var(--fill);display:grid;place-items:center;font-size:15px}
.pane-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--label3);padding:calc(var(--tb-h) + 20px) 40px 40px;text-align:center}
.pane-empty .i{width:30px;height:30px;stroke-width:1.2}
.pane-empty b{color:var(--label2);font-size:13px;font-weight:600}
.pane-empty span{font-size:12px}
.storage-sum{display:flex;flex-direction:column;gap:8px;width:100%}
.storage-sum .big{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.storage-sum .big small{font-size:12px;font-weight:400;color:var(--label2);margin-left:4px}
.bar{height:8px;border-radius:4px;background:var(--fill2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.copy-ok{color:var(--label2)}

/* sheet */
/* Floating sheet: a content-sized card centred over the whole dimmed parent window, titlebar included.
   The scrim only dims; clicking it does nothing (no backdrop commit or dismissal). */
.sheet-layer{position:absolute;inset:0;z-index:50;border-radius:inherit;display:flex;justify-content:center;align-items:center;padding:24px;
  background:var(--scrim);animation:sheet-fade 140ms linear}
.sheet{width:min(460px,100%);max-height:100%;overflow:auto;padding:20px 20px 18px;border-radius:16px;background:var(--sheet-bg);box-shadow:var(--sheet-shadow)}
@keyframes sheet-fade{from{opacity:0}to{opacity:1}}
.sh-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.sh-head h2{margin:0;font-size:13px;font-weight:700;line-height:18px}
.sh-note{margin:3px 0 0;font-size:12px;line-height:16px;color:var(--label2)}
.sh-form{display:grid;grid-template-columns:64px 1fr;column-gap:10px;row-gap:12px;align-items:start}
.sh-form label{text-align:right;padding-top:4px}
.sh-sub{display:flex;justify-content:space-between;gap:10px;margin-top:4px;font-size:11.5px;color:var(--label2);min-height:15px}
.sh-err{color:var(--red);display:inline-flex;align-items:center;gap:4px}
.sh-err .i{width:12px;height:12px}
.sh-count{margin-left:auto;font-variant-numeric:tabular-nums}
.sh-count.over{color:var(--red)}
.sh-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.sh-foot .btn{min-width:76px}

/* ------------------------------------------------------------------ patterns board */
#scenePatterns{width:min(1200px,100%)}
.board{width:100%;min-width:0}
.board-head{display:flex;align-items:baseline;gap:12px;margin:0 2px 14px}
.board-head h1{margin:0;font-size:13px;font-weight:600}
.board-head p{margin:0;font-size:12px;color:var(--label2)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px}
.spec{margin:0;display:flex;flex-direction:column;gap:7px;min-width:0}
.spec.span3{grid-column:1/-1}
.spec figcaption{font-size:12px;color:var(--label2);display:flex;gap:8px;align-items:baseline;padding:0 2px}
.spec figcaption .pid{font-family:var(--mono);font-size:10.5px;color:var(--label3);letter-spacing:0}
.surf{flex:1;border-radius:10px;box-shadow:var(--spec-shadow);padding:16px;position:relative}
.surf.detail{background:var(--detail)}.surf.content{background:var(--content)}.surf.sidebar{background:var(--side-glass);padding:10px 0}
.surf .fs{margin-bottom:0}
.mini-cap{font-size:11px;color:var(--label3);margin:10px 18px 4px}
.role-grid{display:grid;grid-template-columns:86px 1fr;row-gap:12px;column-gap:12px;align-items:center}
.role-grid .k{font-size:11.5px;color:var(--label2);text-align:right}
.role-grid .v{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spinner{width:12px;height:12px;border-radius:50%;border:1.6px solid var(--label4);border-top-color:var(--label2);animation:spin 800ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pair .k{font-size:11px;color:var(--label3);margin-bottom:6px}
.ctx-stage{position:relative;height:100%;min-height:240px}
.ctx-stage .run{margin-top:0}
.cards3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px;align-items:start}
.link-card{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:var(--bubble-in);max-width:300px}
.link-card .lc-img svg{display:block;width:100%;height:110px}
.link-card .lc-t{padding:8px 12px 9px;display:flex;flex-direction:column;font-size:12px;line-height:16px}
.link-card .lc-t b{font-weight:600}
.link-card .lc-t span{color:var(--bubble-in-2)}
.copy-line{display:flex;align-items:center;gap:8px}
.copy-line .mono{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--label2)}
.fb-stack{display:flex;flex-direction:column;gap:14px}
.fb-stack .k{font-size:11px;color:var(--label3);margin-bottom:5px}

.inspector>.scroll-edge{left:1px}
.surf .tb-group{-webkit-backdrop-filter:none;backdrop-filter:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important;animation-iteration-count:1!important}
  .spinner{animation:none}
}
/* Reduce Transparency: chrome falls back to opaque neutral surfaces. */
@media (prefers-reduced-transparency: reduce){
  :root[data-scheme="light"]{--glass:#f7f7f9;--side-glass:#ececef;--menu:#f6f6f8;--content-edge:#fff;--inspector-edge:#f5f5f7;--detail-edge:#f5f5f7}
  :root[data-scheme="dark"]{--glass:#3a3a3e;--side-glass:#2c2c30;--menu:#2c2c30;--content-edge:#1e1e20;--inspector-edge:#232325;--detail-edge:#1f1f21}
}
</style>
</head>

<header class="review" aria-label="Design review controls">
  <div class="rv-left"><span class="rv-title">White Noise for Mac</span><span class="rv-note">Static design preview · sample data</span></div>
  <nav class="seg rv-views" id="viewSeg" aria-label="Preview view">
    <button data-view="main"><span class="k">1</span>Main Window</button>
    <button data-view="inspector"><span class="k">2</span>Inspector</button>
    <button data-view="search"><span class="k">3</span>Search</button>
    <button data-view="settings"><span class="k">4</span>Settings</button>
    <button data-view="sheet"><span class="k">5</span>Edit Sheet</button>
    <button data-view="patterns"><span class="k">6</span>Patterns</button>
  </nav>
  <div class="rv-right"><span class="rv-label" id="szLabel">Window</span>
    <div class="seg" id="szSeg" role="group" aria-labelledby="szLabel">
      <button data-sz="compact">Compact</button><button data-sz="standard">Standard</button><button data-sz="wide">Wide</button>
    </div>
    <span class="rv-size" id="szReadout"></span>
    <span class="rv-label" id="apLabel">Appearance</span>
    <div class="seg" id="apSeg" role="group" aria-labelledby="apLabel">
      <button data-ap="light">Light</button><button data-ap="dark">Dark</button><button data-ap="system">System</button>
    </div>
  </div>
</header>

<main class="stage" id="stage">

  <!-- ============================ MAIN WINDOW (views 1–3) -->
  <section class="scene" id="sceneMain">
    <div class="window main-window" id="mainWin">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="sb-toggle"><button class="tb-btn" id="sbToggle" title="Hide Sidebar (⌃⌘S)" aria-label="Hide Sidebar"><svg class="i"><use href="#i-sidebar"/></svg></button></div>

      <aside class="sidebar" id="sidebar" aria-label="Chats">
        <div class="sb-inner glass-panel">
          <div class="sb-titlebar">
            <button class="tb-btn static" title="New Chat (⌘N)" aria-label="New Chat"><svg class="i"><use href="#i-compose"/></svg></button>
          </div>
          <button class="ident-btn" id="identBtn" aria-haspopup="menu" aria-expanded="false" title="Switch profile">
            <span id="identAv"></span><span class="ident-name" id="identName"></span><svg class="i"><use href="#i-chevrons"/></svg>
          </button>
          <div class="search-field sb-search">
            <svg class="i"><use href="#i-search"/></svg>
            <input id="sbSearch" type="search" placeholder="Search" aria-label="Search all chats" autocomplete="off" spellcheck="false">
            <button class="sf-clear" id="sbClear" aria-label="Clear search" hidden><svg class="i"><use href="#i-xfill"/></svg></button>
          </div>
          <div class="sb-list" id="sbList" role="listbox" aria-label="Chats"></div>
        </div>
      </aside>
      <div class="split-div" id="sbDiv" role="separator" aria-orientation="vertical" aria-label="Sidebar width" tabindex="0"></div>

      <section class="detail">
        <div class="toolbar" id="mainToolbar">
          <div class="tb-title"><div class="tb-name" id="tbName"></div><div class="tb-sub" id="tbSub"></div></div>
          <div class="tb-actions" id="tbActions">
            <div class="tb-group" role="group" aria-label="Find">
              <button class="tb-btn" id="btnFind" title="Find in Conversation (⌘F)" aria-label="Find in Conversation"><svg class="i"><use href="#i-search"/></svg></button>
            </div>
            <div class="tb-group" role="group" aria-label="Inspector and more">
              <button class="tb-btn" id="btnInfo" title="Show Inspector (⌃⌘I)" aria-label="Inspector" aria-pressed="false"><svg class="i"><use href="#i-info"/></svg></button>
              <button class="tb-btn" id="btnMore" title="More" aria-label="More" aria-haspopup="menu" aria-expanded="false"><svg class="i"><use href="#i-ellipsis"/></svg></button>
            </div>
          </div>
        </div>
        <div class="detail-body">
          <div class="conv" id="conv">
            <div class="scroll-edge" aria-hidden="true"></div>
            <div class="findbar" id="findBar" role="search" hidden>
              <div class="search-field">
                <svg class="i"><use href="#i-search"/></svg>
                <input id="findInput" type="search" placeholder="Find in Conversation" aria-label="Find in conversation" autocomplete="off" spellcheck="false">
                <button class="sf-clear" id="findClear" aria-label="Clear find"><svg class="i"><use href="#i-xfill"/></svg></button>
              </div>
              <span class="fb-count" id="findCount" aria-live="polite"></span>
              <div class="ctl-group" role="group" aria-label="Find navigation">
                <button id="findPrev" title="Previous (⇧⌘G)" aria-label="Previous match"><svg class="i"><use href="#i-chevleft"/></svg></button>
                <button id="findNext" title="Next (⌘G)" aria-label="Next match"><svg class="i"><use href="#i-chevright"/></svg></button>
              </div>
              <span class="spacer"></span>
              <button class="btn small" id="findDone">Done</button>
            </div>
            <div class="transcript" id="transcript" aria-label="Messages"></div>
            <div class="composer">
              <button class="c-btn static" title="Attach Files" aria-label="Attach Files"><svg class="i"><use href="#i-paperclip"/></svg></button>
              <div class="c-field">
                <textarea id="composerInput" rows="1" placeholder="Message" aria-label="Message"></textarea>
                <button class="c-btn static" title="Emoji" aria-label="Emoji"><svg class="i"><use href="#i-smile"/></svg></button>
              </div>
              <button class="c-send" id="sendBtn" aria-label="Send" title="Send (Return)" disabled><svg class="i"><use href="#i-arrowup"/></svg></button>
            </div>
          </div>
          <div class="split-div" id="inspDiv" role="separator" aria-orientation="vertical" aria-label="Inspector width" tabindex="0" hidden></div>
          <aside class="inspector" id="inspector" aria-label="Chat info"><div class="scroll-edge" aria-hidden="true"></div><div class="insp-inner" id="inspInner"></div></aside>
        </div>
      </section>
    </div>
  </section>

  <!-- ============================ SETTINGS WINDOW (views 4–5) -->
  <section class="scene" id="sceneSettings" hidden>
    <div class="window set-window" id="setWin">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="set-split" id="setSplit">
        <aside class="set-sidebar">

function sendMessage() {
  const ta = $("#composerInput"), text = ta.value.trim(); if (!text) return;
  const chat = cur();
  const time = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  const lastDay = [...chat.messages].reverse().find(m => m.type === "day");
  if (!lastDay || lastDay.text !== "Today") chat.messages.push({ type: "day", text: "Today" });

function closeSheet(restoreFocus = true) {
  state.sheet = false; $("#sheetLayer").hidden = true; $("#setSplit").inert = false;
  if (restoreFocus) $("#editProfileBtn")?.focus();
}
function validateSheet() {
  const name = fName.value.trim(), n = chars(fAbout.value);
  const nameBad = !name, aboutBad = n > 160;
  $("#sheetAv").innerHTML = avatar(name || "?", 48, 0);
  $("#errName").hidden = !(nameBad && state.sheetTouched);
  fName.classList.toggle("invalid", nameBad && state.sheetTouched);
  fName.setAttribute("aria-invalid", nameBad);
  $("#errAbout").hidden = !aboutBad;
  fAbout.classList.toggle("invalid", aboutBad);
  $("#aboutCount").textContent = `${n} / 160`;
  $("#aboutCount").classList.toggle("over", aboutBad);
  $("#sheetSave").disabled = nameBad || aboutBad;
  return !(nameBad || aboutBad);
}
fName.addEventListener("input", () => { state.sheetTouched = true; validateSheet(); });
fAbout.addEventListener("input", validateSheet);
$("#sheet").addEventListener("submit", e => {
  e.preventDefault();
  state.sheetTouched = true;
  if (!validateSheet()) return;
  state.identity = { name: fName.value.trim(), about: fAbout.value.trim() };
  closeSheet(false); renderSettings(true); renderIdentity(); renderSidebar();
  $("#editProfileBtn")?.focus();
});
$("#sheetCancel").addEventListener("click", () => closeSheet());
fAbout.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#sheet").requestSubmit(); } });

/* ================================================================== patterns board */
function renderPatterns() {
  const n = state.notif, p = PREVIEW[n.preview];
  const nameErr = state.pNameTouched && !state.pName.trim();
  const crit = chatById("crit"), atlas = chatById("atlas"), jonah = chatById("jonah");
  const fig = (pid, cap, body, cls = "") => `<figure class="spec ${cls}"><figcaption><span class="pid">${pid}</span>${cap}</figcaption>${body}</figure>`;
  const row = (c, extra) => `<div class="chat-row ${extra}" style="cursor:default">${avatar(c.title, 40, c.tone)}<span class="cr-main"><span class="cr-top"><span class="cr-name">${esc(c.title)}</span>${state.muted[c.id] ? icon("bellslash", "cr-muted") : ""}<span class="cr-time">${esc(c.time)}</span></span><span class="cr-bottom"><span class="cr-prev">${previewOf(c)}</span>${extra.includes("unread") ? `<span class="badge">2</span>` : ""}</span></span></div>`;
  $("#board").innerHTML = `
  <div class="board-head"><h1>Common patterns</h1><p>Real components at desktop density, in the current appearance.</p></div>
  <div class="grid3">
    ${fig("G01 · C06 · C07", "Grouped form, leading checkboxes and pop-up", `<div class="surf detail">
      <section class="fs"><div class="fs-h">Notifications</div><div class="fs-group">
        ${checkRow("notif.local", "Local notifications", "Creates message notifications on this Mac.", n.local)}
        ${checkRow("notif.push", "Native push", "", n.push, !n.local)}
        <div class="fs-row ${!n.local ? "dim" : ""}"><span class="lbl">Show</span>${popupHTML("preview", p.label, "", !n.local)}</div>
      </div><div class="fs-footer">${esc(p.detail)}</div></section></div>`)}
    ${fig("N03 · T01", "Selected list row, key and inactive window", `<div class="surf sidebar">
      ${row(atlas, "is-sel")}${row(jonah, "unread")}
      <div class="mini-cap">Inactive window</div>${row(atlas, "inactive-sel")}</div>`)}
    ${fig("C01 · C02 · C04", "Button roles", `<div class="surf detail"><div class="role-grid">
      <span class="k">Completion</span><span class="v"><button class="btn">Cancel</button><button class="btn primary">Save</button></span>
      <span class="k">Secondary</span><span class="v"><button class="btn">Edit Profile…</button><button class="btn">${icon("copy")}Copy</button></span>
      <span class="k">Destructive</span><span class="v"><button class="btn danger">Leave Group…</button></span>
      <span class="k">Unavailable</span><span class="v"><button class="btn primary" disabled>Save</button><button class="btn" disabled><span class="spinner" aria-hidden="true"></span>Saving…</button></span>
      <span class="k">Toolbar groups</span><span class="v"><span class="tb-group" role="group" aria-label="Find"><button class="tb-btn" title="Find in Conversation" aria-label="Find in Conversation">${icon("search")}</button></span><span class="tb-group" role="group" aria-label="Inspector and more"><button class="tb-btn on" title="Hide Inspector" aria-label="Inspector" aria-pressed="true">${icon("info")}</button><button class="tb-btn" title="More" aria-label="More">${icon("ellipsis")}</button></span></span>
    </div></div>`)}
    ${fig("C08 · G05", "Segmented value versus command group", `<div class="surf detail"><div class="pair">
      <div><div class="k">One value (selection persists)</div>${segHTML("pseg", [["media", "Media"], ["files", "Files"], ["links", "Links"]], state.pseg, "full")}${sharedHTML(state.pseg)}</div>
      <div><div class="k">Commands (momentary)</div><div class="ctl-group wide" role="group" aria-label="Message actions"><button title="Reply" aria-label="Reply">${icon("reply")}</button><button title="Copy" aria-label="Copy">${icon("copy")}</button><button title="Forward" aria-label="Forward">${icon("forward")}</button></div></div>
    </div></div>`)}
    ${fig("K02 · K03", "Context menu: clicked message, action glyphs, no shortcuts", `<div class="surf content"><div class="ctx-stage" id="ctxStage">
      <div class="run in"><div class="run-stack" style="max-width:86%"><div class="run-head"><span class="run-sender">Theo Lindqvist</span><span class="run-time">9:58 AM</span></div>
      <div class="bubble single ${state.pmenu ? "ctx-target" : ""}" id="ctxBubble">Can we move crit to Thursday? Half the team is in the release review.</div></div></div>
      ${state.pmenu ? `<div class="menu inline ${menuClass(messageMenuItems(false, false))}" role="menu" style="left:72px;top:78px">${menuHTML(messageMenuItems(false, false))}</div>` : `<p class="fs-footer" style="position:absolute;bottom:0;margin:0">Right-click the message to show its menu.</p>`}
    </div></div>`)}
    ${fig("E02 · E03 · E05", "Inline feedback at the control", `<div class="surf detail"><div class="fb-stack">
      <div><div class="k">Field validation</div><input class="tf ${nameErr ? "invalid" : ""}" id="pName" placeholder="Enter your name" value="${esc(state.pName)}" aria-label="Name" aria-invalid="${nameErr}">
        <div class="sh-sub">${nameErr ? `<span class="sh-err">${icon("exclaim")}Enter a name.</span>` : ""}</div></div>
      <div><div class="k">Copy confirmation</div><div class="copy-line"><span class="mono">${esc(npubShort(NPUB))}</span><button class="btn small" data-copy="pcopy">${state.copied === "pcopy" ? `${icon("check")}Copied` : "Copy"}</button></div></div>
      <div><div class="k">Progress near the task</div><div class="copy-line"><span class="spinner" aria-hidden="true"></span><span style="font-size:12px;color:var(--label2)">Checking shared groups…</span></div></div>
    </div></div>`)}
    ${fig("G03 · D02 · T07", "Neutral content cards", `<div class="surf content"><div class="cards3">
      <div><div class="mini-cap" style="margin:0 0 6px">File in transcript</div><div class="run in" style="margin:0"><div class="run-stack" style="max-width:100%"><div class="bubble single file"><div class="file-card">${docGlyph("PDF")}<span class="file-main"><span class="file-name">Atlas-2.0-release-checklist.pdf</span><span class="file-meta">248 KB · PDF document</span></span></div></div></div></div></div>
      <div><div class="mini-cap" style="margin:0 0 6px">Link preview</div><div class="link-card"><div class="lc-img">${`<svg viewBox="0 0 300 110" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="110" fill="#d6d6da"/><rect x="24" y="22" width="120" height="10" rx="5" fill="#1d1d1f"/><rect x="24" y="42" width="190" height="6" rx="3" fill="#a9a9ae"/><rect x="24" y="54" width="150" height="6" rx="3" fill="#a9a9ae"/><rect x="200" y="20" width="76" height="70" rx="8" fill="#1d1d1f"/><rect x="212" y="34" width="40" height="6" rx="3" fill="#f2f2f4"/><rect x="212" y="46" width="52" height="4" rx="2" fill="#5a5a5e"/></svg>`}</div><div class="lc-t"><b>Atlas 2.0 release notes (draft)</b><span>docs.atlas.example</span></div></div></div>
      <div><div class="mini-cap" style="margin:0 0 6px">Shared file rows</div><div class="fs-group" style="padding:2px 10px">${sharedHTML("files").replace('class="list-rows"', 'class="list-rows" style="margin:0"')}</div></div>
    </div></div>`, "span3")}
  </div>`;
}
function hidePatternMenu() {
  // DOM-only dismissal, so a click that dismisses the menu still reaches the control under it.
  state.pmenu = false;
  $("#ctxStage .menu.inline")?.remove();
  $("#ctxBubble")?.classList.remove("ctx-target");
  $("#ctxStage")?.insertAdjacentHTML("beforeend", `<p class="fs-footer" style="position:absolute;bottom:0;margin:0">Right-click the message to show its menu.</p>`);
}
$("#board").addEventListener("click", e => {
  if (state.pmenu && !e.target.closest("#ctxBubble")) hidePatternMenu();
  const t = e.target.closest("[data-seg],[data-popup],[data-copy]");
  if (!t) return;
  if (t.dataset.seg === "pseg") { state.pseg = t.dataset.v; renderPatterns(); return; }
  if (t.dataset.popup) { popupMenu(t); return; }
  if (t.dataset.copy) flashCopied(t.dataset.copy, renderPatterns);
});
$("#board").addEventListener("contextmenu", e => {
  if (e.target.closest("#ctxBubble")) { e.preventDefault(); state.pmenu = true; renderPatterns(); }
});
$("#board").addEventListener("input", e => {
  if (e.target.id === "pName") {
    state.pName = e.target.value;
    const bad = !state.pName.trim();
    e.target.classList.toggle("invalid", bad); e.target.setAttribute("aria-invalid", bad);
    e.target.nextElementSibling.innerHTML = bad ? `<span class="sh-err">${icon("exclaim")}Enter a name.</span>` : "";
  }
});

/* ================================================================== keyboard */
document.addEventListener("keydown", e => {
  const inField = e.target.matches && e.target.matches("input, textarea");
  const mainVisible = !$("#sceneMain").hidden;
  if (openMenu && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    const items = [...openMenu.el.querySelectorAll(".menu-item:not(:disabled)")];
    const i = items.indexOf(document.activeElement);
    const n = items[(i + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length];
    if (n) { e.preventDefault(); n.focus(); } return;
  }
  if (e.key === "Escape") {
    if (openMenu) { e.preventDefault(); const a = openMenu.anchor; closeMenu(); a?.focus(); return; }
    if (state.sheet && !$("#sceneSettings").hidden) { e.preventDefault(); closeSheet(); return; }
    if (!$("#scenePatterns").hidden && state.pmenu) { hidePatternMenu(); return; }
    if (mainVisible && state.find.open) { closeFind(); return; }
    return;
  }
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mainVisible && e.metaKey && e.ctrlKey && k === "i") { e.preventDefault(); toggleInspector(); return; }
  if (mainVisible && e.metaKey && e.ctrlKey && k === "s") { e.preventDefault(); toggleSidebar(); return; }
  if (mainVisible && mod && !e.shiftKey && !e.altKey && k === "f") { e.preventDefault(); openFindUI(); return; }
  if (mainVisible && mod && k === "g" && state.find.open) { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); return; }
  if (mod && e.key === ",") { e.preventDefault(); applyView("settings"); return; }
  if (!inField && !mod && !e.altKey && /^[1-6]$/.test(e.key) && !state.sheet) applyView(VIEWS[+e.key - 1]);
});

/* ================================================================== boot */
applyAppearance();
applyView("main");
</script>
</body>
</html>
