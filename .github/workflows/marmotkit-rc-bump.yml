name: MarmotKit RC bump

# Once a day, after MDK's RC lane publishes, pin develop to the latest verified
# MarmotKit Release Candidate (mdk `rc-meta:rc/latest.json`) and open or refresh
# one pull request into develop. Never touches master: production pins Stable
# only (scripts/ci/check-marmotkit-channel.sh). See docs/release-flow.md.
#
# GitHub runs scheduled workflows from the default branch's copy of this file,
# so it must be on the default branch (ideally `develop`) to run daily; it can
# always be started by hand (workflow_dispatch).
#
# A PR opened with the default GITHUB_TOKEN does not start other workflows, so
# Mac CI would not run on it. Set the repository secret MARMOTKIT_BUMP_TOKEN (a
# fine-grained token with contents and pull-requests write on this repository)
# so the bump PR gets CI like any other.

on:
  schedule:
    - cron: "40 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marmotkit-rc-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Pin the latest MarmotKit RC
    # sync-bindings.sh needs SwiftPM, plutil and BSD sed.
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      BASE: develop
      BRANCH: automation/marmotkit-rc
      GH_TOKEN: ${{ secrets.MARMOTKIT_BUMP_TOKEN || github.token }}

    steps:
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          # History, to tell the bot's commits on the bump branch from people's.
          fetch-depth: 0
          token: ${{ secrets.MARMOTKIT_BUMP_TOKEN || github.token }}

      - name: Pin the latest verified RC
        id: sync
        run: scripts/sync-rc.sh --summary "$RUNNER_TEMP/rc-summary.md"

      - name: Check the pin
        if: steps.sync.outputs.changed == 'true'
        run: scripts/ci/macos-sanity-checks.sh

      - name: Open or refresh the bump PR
        if: steps.sync.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.sync.outputs.version }}
          IMPACT: ${{ steps.sync.outputs.impact }}
          BREAKING: ${{ steps.sync.outputs.breaking }}
        run: |
          set -euo pipefail
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git config user.email "$bot_email"

          # Someone is fixing call sites on the open bump branch: never force-push
          # over their commits. Say a newer RC is out and leave the branch alone.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null; then
            others="$(git log --format=%ae "origin/$BRANCH" --not "origin/$BASE" | grep -vxF "$bot_email" || true)"
            if [[ -n "$others" ]]; then
              existing="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
              if [[ -n "$existing" ]]; then
                gh pr comment "$existing" --body "MarmotKit $VERSION ($IMPACT) is out. This branch has hand-made commits, so it was not replaced: run \`just sync-rc\` on it to move to $VERSION, or merge it and the next bump picks $VERSION up."
              fi
              echo "$BRANCH has commits by people; not replacing it."
              exit 0
            fi
          fi

          git switch -C "$BRANCH"
          git add Vendored/MarmotKit
          git commit --quiet -m "Pin MarmotKit $VERSION (staging RC, $IMPACT)"
          git push --force origin "$BRANCH"

          title="Pin MarmotKit $VERSION (staging RC)"
          if [[ "$IMPACT" == "minor" || "$BREAKING" != "0" ]]; then
            title="$title: $IMPACT, $BREAKING breaking UniFFI changes"
          fi
          existing="$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --title "$title" --body-file "$RUNNER_TEMP/rc-summary.md"
          else
            gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/rc-summary.md"
          fi
